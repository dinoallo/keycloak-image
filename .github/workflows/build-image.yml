# =============================================================================
# Build and publish the custom Keycloak Docker image
# =============================================================================
name: Build Keycloak Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      idp_binary_url:
        description: "URL of the identity provider binary JAR"
        required: false
        default: "https://github.com/dinoallo/keycloak-feishu/releases/download/v1.0.0/keycloak-feishu.jar"
      image_tag:
        description: "Override image tag (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve IDP_BINARY_URL: input > repo variable > built-in default
      - name: Resolve IDP_BINARY_URL
        id: idp_url
        run: |
          if [ -n "${{ github.event.inputs.idp_binary_url }}" ]; then
            echo "value=${{ github.event.inputs.idp_binary_url }}"
          elif [ -n "${{ vars.IDP_BINARY_URL }}" ]; then
            echo "value=${{ vars.IDP_BINARY_URL }}"
          else
            echo "value=https://github.com/dinoallo/keycloak-feishu/releases/download/v1.0.0/keycloak-feishu.jar"
          fi >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IDP_BINARY_URL=${{ steps.idp_url.outputs.value }}
